name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_ENV: production
  # Disable npm audit warnings in CI to focus on build/test results
  npm_config_audit_level: moderate

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --include=dev

    - name: Verify React and ReactDOM versions match
      run: |
        node -e "
          const react = require('./node_modules/react/package.json').version;
          const reactDom = require('./node_modules/react-dom/package.json').version;
          console.log({ react, reactDom });
          if (react !== reactDom) {
            console.error('react and react-dom versions must match!');
            process.exit(1);
          }
        "

    - name: Run linter
      run: npm run lint || echo "Linting completed with warnings/errors"

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Build artifacts:"
        ls -la dist/
        echo "📊 Bundle size:"
        du -sh dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.node-version == '20.x'
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --include=dev

    - name: Run tests
      run: npm run test:run

  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --include=dev

    - name: Run security audit
      run: npm audit --audit-level=high || echo "Security audit found vulnerabilities. Review recommended."
      continue-on-error: true

    - name: Check for outdated dependencies
      run: npm outdated || true

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --include=dev

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/

    - name: Install Playwright Chromium
      run: |
        npm install --no-save --include=dev playwright
        npx playwright install --with-deps chromium

    - name: Run production bundle smoke test
      run: node scripts/smoke-test.mjs
